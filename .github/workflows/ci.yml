name: CI Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/kabinett-backend
            ghcr.io/${{ github.repository_owner }}/kabinett-frontend

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend      # <--- El contexto es la carpeta backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kabinett-backend:latest
            ghcr.io/${{ github.repository_owner }}/kabinett-backend:${{ github.sha }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend     # <--- El contexto es la carpeta frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kabinett-frontend:latest
            ghcr.io/${{ github.repository_owner }}/kabinett-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ github.ref_name }}
